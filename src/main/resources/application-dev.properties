spring.datasource.url=jdbc:h2:mem:ecommercedb
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.h2.console.enabled=true
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.open-in-view=false
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

app.jwt.secret=${JWT_SECRET:storestack-dev-only-secret-key-change-before-production}
app.jwt.access-token-expiration-ms=${JWT_ACCESS_EXPIRATION_MS:900000}
app.jwt.refresh-token-expiration-ms=${JWT_REFRESH_EXPIRATION_MS:604800000}
app.seed.admin.email=${DEV_ADMIN_EMAIL:admin@storestack.local}
app.seed.admin.password=${DEV_ADMIN_PASSWORD:Admin12345}
app.cors.allowed-origin=${FRONTEND_ORIGIN:http://localhost:5173}
