services:
  postgres:
    image: postgres:17-alpine
    profiles:
      - prod
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-storestack}
      POSTGRES_USER: ${DB_USERNAME:?Set DB_USERNAME in your environment or local .env}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in your environment or local .env}
    ports:
      - "5432:5432"
    volumes:
      - storestack_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  storestack_postgres_data:
